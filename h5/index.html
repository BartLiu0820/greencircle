<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>绿色循环圈外传 H5</title>
<link rel="stylesheet" href="style.css?v=20261023a">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="menu">
      <button id="btn-help">任务(F9)</button>
      <button id="btn-pause">暂停(P)</button>
      <button id="btn-speed">速度 1x</button>
      <button id="btn-start" class="go">立即开始</button>
    </div>
    <div class="res">
      <span class="r"><i class="ico gold-ico"></i><b id="r-gold" class="gold">0</b></span>
      <span class="r"><i class="ico wood-ico"></i><b id="r-wood" class="wood">0</b></span>
      <span class="r"><i class="ico food-ico"></i><b id="r-food">0/0</b></span>
      <span class="r" title="当局成就：在兔子那里买道具"><i class="ico ach-ico"></i><b id="r-ach" class="ach">0</b></span>
      <span class="r mode" id="r-mode"></span>
    </div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <canvas id="gl3d" class="layer"></canvas>
    <canvas id="ov" class="layer"></canvas>
    <div id="quick">
      <button id="q-builder" title="守卫者 (F1)"><span>守</span></button>
      <button id="q-hero" class="hidden" title="英雄塔 (F2)"><span id="q-hero-name">英</span><em id="q-hero-lv">1</em></button>
    </div>
    <div id="wavebox">
      <div class="wt"><span id="w-title">准备阶段</span><span id="w-timer">00:60</span></div>
      <div class="wc">当前怪数: <b id="w-count">0</b>（最大 <b id="w-cap">40</b>）<span class="pf">Perfect <b id="w-perfect">0</b></span></div>
      <div id="w-hint"></div>
    </div>
    <div id="msgs"></div>
    <div id="tip" class="hidden"></div>
  </main>

  <footer id="console">
    <div id="mmwrap">
      <canvas id="minimap"></canvas>
      <div class="zbtn"><button id="btn-zin" title="放大">+</button><button id="btn-zout" title="缩小">−</button><button id="btn-snd" title="声音">♪</button></div>
    </div>
    <div id="portrait"><canvas id="pcv"></canvas><div class="fb"></div></div>
    <div id="hpt" class="bartxt"></div>
    <div id="mpt" class="bartxt"></div>
    <div id="info"></div>
    <div id="inv"></div>
    <div id="cmd"></div>
  </footer>
</div>
<div id="modal" class="hidden"><div id="modal-box"></div></div>
<script src="assets/manifest.js?v=20261020b"></script>
<script src="assets/war3_icons.js?v=20261023a"></script>
<script src="assets/sprites.js?v=20261022a"></script>
<script src="assets/w3missiles.js?v=20261020b"></script>
<script src="assets/w3portraits.js?v=20261020b"></script>
<script src="data.js?v=20261022c"></script>
<script src="waves.js?v=20261023a"></script>
<script src="assets/w3terrain.js?v=20261022a"></script>
<script src="assets/w3map.js?v=20261023a"></script>
<script src="terrain.js?v=20261023a"></script>
<script src="fx.js?v=20261022b"></script>
<script src="vendor/mdx-m3-viewer-5.12.0.min.js"></script>
<script src="assets/w3sounds.js?v=20261021a"></script>
<script src="sound.js?v=20261021a"></script>
<script src="units3d.js?v=20261022d"></script>
<script src="game.js?v=20261023c"></script>
</body>
</html>
